# Render Blueprint: the full app as one Docker web service with a PostgreSQL
# database. New > Blueprint in the Render dashboard, then pick this repository.
#
# Memory: the embedding model plus the reranker need about 1–1.5 GB, so the
# "standard" plan (2 GB) is used. On a 512 MB plan set RERANKER_MODEL to an
# empty value (matching then uses embeddings alone, which is less precise).
# Uploads are kept only until the next analysis reads them, so the service runs
# without a persistent disk.

services:
  - type: web
    name: waypoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      - key: RUN_WORKER
        value: "true" # one process: the worker runs inside the API
      - key: YOUTUBE_API_KEY
        sync: false # optional; set it in the dashboard
      - key: GOOGLE_VISION_API_KEY
        sync: false # optional

databases:
  - name: waypoint-db
    databaseName: waypoint
    user: waypoint
    plan: basic-256mb
